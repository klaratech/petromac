name: Deploy to Test (staging)

# Every push to main lands on https://test.petromac.co.nz automatically.
# Production (www.petromac.co.nz) is NOT touched — it only changes when the
# "Promote to Production" workflow is run (deploy-prod.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: petromac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image refs
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::7}"
          image="${REGISTRY}/${owner_lc}/${IMAGE_BASE}-${{ matrix.component }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          if [ "${{ matrix.component }}" = "frontend" ]; then
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=./backend/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          # STAGING identity: test-site URL, no NEXT_PUBLIC_ENV → the build
          # derives noindex + Disallow-all robots automatically (siteUrl.ts).
          # Turnstile widget hostname covers subdomains, same site key.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://test.petromac.co.nz
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            # NEXT_PUBLIC_CF_ANALYTICS_TOKEN is deliberately NOT passed here.
            # WebAnalytics.tsx already gates on isProductionSite(), so the
            # beacon wouldn't render on test anyway — withholding the token is a
            # second, unconditional guard, so our own testing can never land in
            # the production numbers even if that gate is ever removed.
          tags: |
            ${{ steps.meta.outputs.image }}:staging
            ${{ steps.meta.outputs.image }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-staging
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH and redeploy TEST stack only
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /root/apps/petromac
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull frontend-test
            docker compose pull backend-test
            docker compose up -d frontend-test backend-test
            docker image prune -f
            docker logout ghcr.io || true
            echo "--- test stack after deploy ---"
            docker compose ps frontend-test backend-test

      - name: Summary
        run: |
          {
            echo "## Deployed to TEST"
            echo
            echo "- https://test.petromac.co.nz (noindex build)"
            echo "- Images: \`:staging\` + \`:staging-${GITHUB_SHA::7}\`"
            echo "- Production untouched — promote via the 'Promote to Production' workflow."
          } >> "$GITHUB_STEP_SUMMARY"
