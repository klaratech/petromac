name: Build and Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: petromac
  DEPLOY_PATH: /root/apps/petromac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # When one component fails (e.g. transient ghcr.io timeout), let the
      # other keep building so a re-run only has to retry the failed axis.
      fail-fast: false
      matrix:
        component: [frontend, backend]
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image refs
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::7}"
          image="${REGISTRY}/${owner_lc}/${IMAGE_BASE}-${{ matrix.component }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          if [ "${{ matrix.component }}" = "frontend" ]; then
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=./backend/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          # Site identity for the frontend build (backend ignores these).
          # Unset repo variables => empty => staging defaults. Cutover =
          # set NEXT_PUBLIC_SITE_URL=https://www.petromac.co.nz and
          # NEXT_PUBLIC_ENV=production in Settings → Variables, then re-run.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ENV=${{ vars.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /root/apps/petromac
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "--- containers after deploy ---"
            docker compose ps

      - name: Write deployment summary
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Deployed"
            echo
            echo "- Frontend: \`ghcr.io/${owner_lc}/petromac-frontend\`"
            echo "- Backend:  \`ghcr.io/${owner_lc}/petromac-backend\`"
            echo "- Tags:     \`:latest\` + \`:sha-${SHORT_SHA}\`"
            echo "- Server path: \`/root/apps/petromac\`"
          } >> "$GITHUB_STEP_SUMMARY"
