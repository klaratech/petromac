name: Promote to Production

# THE go-live button. Runs only when dispatched (Actions → Promote to
# Production → Run workflow). Builds the chosen ref (default: main HEAD)
# with the PRODUCTION identity and flips the prod containers — the test
# stack at test.petromac.co.nz is untouched. Day-to-day pushes deploy only
# to test via deploy-staging.yml.
#
# Every successful promote moves the `production` git tag to the commit it
# shipped, then verifies www. The nightly data refresh dispatches this
# workflow itself when that tag shows only operations data is pending.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to promote (branch, tag, or sha)'
        required: false
        default: 'main'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: petromac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout promoted ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image refs
        id: meta
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="$(git rev-parse --short=7 HEAD)"
          image="${REGISTRY}/${owner_lc}/${IMAGE_BASE}-${{ matrix.component }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          if [ "${{ matrix.component }}" = "frontend" ]; then
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=./backend/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          # PRODUCTION identity from repo variables (backend ignores these).
          # next.config.ts fails the build on an inconsistent pair.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ENV=${{ vars.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_CF_ANALYTICS_TOKEN=${{ vars.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:prod
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the production tag
      packages: read
    steps:
      - name: SSH and redeploy PROD stack only
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /root/apps/petromac
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull frontend
            docker compose pull backend
            docker compose up -d frontend backend
            docker image prune -f
            docker logout ghcr.io || true
            echo "--- prod stack after deploy ---"
            docker compose ps frontend backend

      # The containers are swapped at this point, so the tag records what www
      # runs even if the check below fails. The nightly auto-promote gate
      # diffs against it.
      - name: Move the production tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/production" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/production -f sha="$SHA" > /dev/null
          fi
          echo "production tag → $SHA"

      - name: Verify www
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          set -euo pipefail
          base=https://www.petromac.co.nz
          want=$(gh api "repos/$GITHUB_REPOSITORY/contents/public/data/operations_stats.json?ref=$SHA" --jq .content \
            | base64 -d | jq -r '"\(.deployments) \(.generatedAt)"')
          # Containers need a few seconds to start serving after `up -d`.
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' "$base/" || true)
            got=$(curl -s "$base/data/operations_stats.json?v=$GITHUB_RUN_ID-$i" | jq -r '"\(.deployments) \(.generatedAt)"' 2>/dev/null || true)
            if [ "$code" = 200 ] && [ "$got" = "$want" ] && grep -q 'content="index, follow"' /tmp/home.html; then
              echo "www verified: HTTP 200, index/follow, stats $got"
              echo "- Verified: HTTP 200, \`index, follow\`, stats \`$got\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: http=$code stats='$got' (want '$want') — retrying in 10s"
            sleep 10
          done
          echo "::error::www did not verify after 2 min — check https://www.petromac.co.nz (stats want '$want', got '$got')"
          exit 1

      - name: Write deployment summary
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
          PROMOTED_REF: ${{ inputs.ref }}
        run: |
          {
            echo "## PROMOTED TO PRODUCTION"
            echo
            echo "- https://www.petromac.co.nz"
            echo "- Ref: \`${PROMOTED_REF}\` → \`sha-${SHORT_SHA}\`"
            echo "- Images: \`:prod\` + \`:sha-${SHORT_SHA}\`"
            echo "- Rollback: pin the previous \`:sha-*\` tag in the compose file (see DEPLOY.md)"
          } >> "$GITHUB_STEP_SUMMARY"
