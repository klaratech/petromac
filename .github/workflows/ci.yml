name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supply chain is this site's real attack surface: there is no database
      # and nothing writes to disk at runtime, so the way hostile code reaches
      # production is by riding in through a dependency at BUILD time.
      #
      # Two steps on purpose. The gate fails only on CRITICAL, because
      # everything below that is currently transitive through `next` itself
      # (postcss, sharp, @babel/core) and cannot be fixed here until Next bumps
      # its own ranges — gating on `high` would fail every run forever, and a
      # check that always fails is a check everyone learns to ignore. The
      # informational step then prints the full count so the number stays
      # visible and someone notices when it climbs.
      - name: Audit dependencies (gate — critical only)
        run: pnpm audit --prod --audit-level critical

      - name: Audit dependencies (informational, never fails)
        if: ${{ always() }}
        continue-on-error: true
        run: pnpm audit --prod

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Guards the committed flipbook manifests/pages + the success-stories
      # tags CSV against drift. Pure Node — no poppler/python needed, since
      # it validates published assets rather than rebuilding them.
      - name: Validate flipbook assets + success-stories tags
        run: pnpm run data:check

      - name: Production build
        run: pnpm build

  # Separate job so a browser failure reads as "e2e" rather than "CI", and so
  # the Playwright browser download stays out of the fast lint/typecheck lane.
  # It builds again rather than sharing an artifact with the job above: the
  # build is ~20 s, and passing .next between jobs costs more in upload time
  # than it saves.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the config defines no other project, so anything else
      # is a wasted download.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # test:e2e drives `next start`, so the build has to exist first.
      - name: Production build
        run: pnpm build

      # Playwright starts and stops the server itself (see webServer in
      # playwright.config.ts). The FastAPI backend is not running here, so the
      # PDF-endpoint test skips itself rather than failing.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
