name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Guards the committed flipbook manifests/pages + the success-stories
      # tags CSV against drift. Pure Node — no poppler/python needed, since
      # it validates published assets rather than rebuilding them.
      - name: Validate flipbook assets + success-stories tags
        run: pnpm run data:check

      - name: Production build
        run: pnpm build
