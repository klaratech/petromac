# Nightly operations-data refresh — no Mac involved.
#
# Downloads the Jobs History Master workbook from the company SharePoint via
# Microsoft Graph (app-only client credentials on the existing "Petromac
# Intranet" Entra app — the same app EMAIL_SETUP.md documents), runs the
# operations pipeline, and pushes the regenerated public/data artifacts.
# A push deploys TEST only; production still goes through Promote.
#
# The workbook is addressed by its web URL (from sources/sources.json,
# the registry of every SharePoint content location) through Graph's
# /shares endpoint. The Mac shows the file under
# "OneDrive - PETROMAC Ltd/04.Marketing/", but that folder is really the
# synced "Marketing" library of /sites/operations — the personal-drive
# path form (/users/{upn}/drive/root:/…) 404s on it, which is why /shares.
#
# GATED until the one-time setup in docs/ADMIN.md §1 is done (Entra
# Files.Read.All application permission + the three ENTRA_* secrets).
# Enable with:
#   gh variable set DATA_REFRESH_ENABLED -b true
# Until then every scheduled run shows as "skipped" — that is deliberate.
#
# NOTE: pushes made with GITHUB_TOKEN do not trigger on:push workflows, so
# this job dispatches deploy-staging.yml itself and runs typecheck + unit
# tests in-job as the CI stand-in (the staging deploy still does the full
# production build before anything ships).
#
# AUTO-PROMOTE (Sep 2026): once test is deployed and smoke-tested, the new
# data goes to www too — but ONLY when the three operations_*.json files are
# the sole difference between the `production` git tag (moved by every
# Promote run) and the commit just verified on test. Any other unpromoted
# change (code, content refresh) holds www back for a human promote, so the
# go-live button still gates everything except data. Kill switch:
#   gh variable set AUTO_PROMOTE_DATA -b false

name: Nightly data refresh

on:
  schedule:
    - cron: '30 1 * * *' # 02:30/03:30 Europe/Rome depending on DST
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.DATA_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write # to dispatch the staging deploy after pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download workbook from SharePoint (Graph app-only)
        env:
          TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # The source registry (sources/sources.json) is the single home
          # for every SharePoint location — it replaced the
          # DATA_WORKBOOK_URL repo variable (Sep 2026).
          WORKBOOK_URL=$(jq -r '.operations.url' sources/sources.json)
          resp=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -d grant_type=client_credentials \
            -d client_id="${CLIENT_ID}" \
            -d client_secret="${CLIENT_SECRET}" \
            -d scope=https://graph.microsoft.com/.default)
          token=$(jq -r '.access_token // empty' <<<"$resp")
          if [ -z "$token" ]; then
            echo "::error::Token request failed — Entra says:"
            jq 'del(.access_token)' <<<"$resp"
            exit 1
          fi
          # Graph /shares addressing: base64url-encode the file's web URL.
          url="${WORKBOOK_URL// /%20}"
          enc=$(printf '%s' "$url" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          out="sources/operations/jobs-history-master.xlsx"
          http=$(curl -sL -w "%{http_code}" -H "Authorization: Bearer $token" \
            -o "$out" \
            "https://graph.microsoft.com/v1.0/shares/u!${enc}/driveItem/content")
          if [ "$http" != "200" ]; then
            echo "::error::Graph download returned HTTP $http — response body:"
            cat "$out"; echo
            echo "URL tried: $url"
            echo "403 => Files.Read.All application permission is missing admin consent (ADMIN.md §1)."
            echo "404 => the workbook moved or was renamed — update .operations.url in sources/sources.json."
            rm -f "$out"
            exit 1
          fi
          # Sanity: an xlsx is a zip and this one is ~2 MB — a tiny file is an error page.
          size=$(stat -c %s "$out")
          if [ "$size" -lt 100000 ]; then
            echo "::error::Downloaded file is only ${size} bytes — not the workbook."
            exit 1
          fi
          ls -la sources/operations/

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install polars==1.38.0 fastexcel==0.19.0 openpyxl==3.1.5

      - name: Run operations pipeline
        env:
          SKIP_GITHUB_PUSH: 'true'
        run: pnpm run data:operations

      # operations_stats.json carries generatedAt (today's date), so it alone
      # is not a signal — only commit when the actual records changed.
      - name: Detect real data changes
        id: diff
        run: |
          if git diff --quiet -- public/data/operations_data.json public/data/operations_full.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- public/data
            echo "Workbook produced identical records — nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck + unit tests (CI stand-in for the bot push)
        if: steps.diff.outputs.changed == 'true'
        run: pnpm typecheck && pnpm test:unit

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          stats=$(jq -r '"\(.deployments) deployments, \(.countries) countries"' public/data/operations_stats.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operations_data.json public/data/operations_full.json public/data/operations_stats.json
          git commit -m "data: nightly operations refresh from OneDrive ($stats)"
          git push
          echo "Published: $stats — deploying to test.petromac.co.nz." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to test
        id: deploy_test
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API occasionally 500s on dispatch (seen 15 Sep 2026).
          # The push above already landed, so a lost dispatch just leaves
          # test stale — retry before failing the night.
          for i in 1 2 3; do
            if out=$(gh workflow run deploy-staging.yml --ref main 2>&1); then
              echo "$out"
              # gh >= 2.87 prints the new run's URL; the wait step falls back
              # to the newest dispatched run if it doesn't.
              run_id=$(grep -oE 'actions/runs/[0-9]+' <<<"$out" | grep -oE '[0-9]+$' || true)
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$out"
            echo "dispatch attempt $i failed; retrying in $((i * 15))s…"
            sleep $((i * 15))
          done
          echo "::error::deploy-staging dispatch failed 3x — test is stale until the next push or a manual 'gh workflow run deploy-staging.yml'."
          exit 1

      - name: Wait for the test deploy
        id: test_deploy
        if: steps.diff.outputs.changed == 'true' && vars.AUTO_PROMOTE_DATA != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deploy_test.outputs.run_id }}
        run: |
          set -euo pipefail
          run_id="$RUN_ID"
          if [ -z "$run_id" ]; then
            sleep 15
            run_id=$(gh run list --workflow deploy-staging.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Waiting for deploy-staging run $run_id…"
          gh run watch "$run_id" --interval 30 > /dev/null || true
          conclusion=$(gh run view "$run_id" --json conclusion -q .conclusion)
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != "success" ]; then
            # Not an error of THIS run: a failed staging deploy reports itself,
            # and a cancelled one means a human push superseded it.
            echo "::warning::Test deploy $run_id ended '$conclusion' — not auto-promoting."
            echo "Test deploy ended **$conclusion** — www not auto-promoted." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Proves the build we're about to promote actually serves the new data.
      - name: Smoke-test test.petromac.co.nz
        if: steps.test_deploy.outputs.conclusion == 'success'
        run: |
          set -euo pipefail
          base=https://test.petromac.co.nz
          for path in / /track-record /catalog /success-stories; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            [ "$code" = 200 ] || { echo "::error::$base$path returned $code"; exit 1; }
          done
          want=$(jq -r '"\(.deployments) \(.generatedAt)"' public/data/operations_stats.json)
          got=$(curl -s "$base/data/operations_stats.json?v=$GITHUB_RUN_ID" | jq -r '"\(.deployments) \(.generatedAt)"')
          [ "$got" = "$want" ] || { echo "::error::test serves stats '$got', expected '$want'"; exit 1; }
          echo "Test verified: $got" >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-promote data to production
        if: steps.test_deploy.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tree diff between two commits needs no history, so a depth-1
          # fetch of the tag is enough on this shallow checkout.
          if ! git fetch -q --depth=1 origin refs/tags/production:refs/tags/production; then
            echo "::warning::No 'production' tag yet — run Promote once by hand; not auto-promoting."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          pending=$(git diff --name-only production "$sha")
          if [ -z "$pending" ]; then
            echo "www already serves this commit's content — nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          other=$(grep -vxE 'public/data/operations_(data|full|stats)\.json' <<<"$pending" || true)
          if [ -n "$other" ]; then
            echo "::warning::Unpromoted non-data changes are waiting — www keeps its last promote until someone runs Promote to Production."
            {
              echo "### www NOT auto-promoted"
              echo "These changes since the last promote need a human go-live:"
              echo '```'
              echo "$other"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in 1 2 3; do
            gh workflow run deploy-prod.yml -f ref="$sha" && {
              echo "Data-only change — promoting \`${sha::7}\` to www." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            echo "promote dispatch attempt $i failed; retrying in $((i * 15))s…"
            sleep $((i * 15))
          done
          echo "::error::deploy-prod dispatch failed 3x — www is behind test until a manual Promote."
          exit 1
