[project]
name = "petromac-backend"
version = "0.1.0"
description = "Backend API for Petromac frontend, email delivery, and track-record data"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<47.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "pypdf>=5.4,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.35,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.app"]
