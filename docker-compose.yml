# Local development docker-compose. Bound to 127.0.0.1 to match the
# production pattern (cloudflared connects only to localhost on the server).
# Production compose lives at deploy/docker-compose.prod.yml.

services:
  petromac-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petromac-frontend:local
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.dev
    environment:
      API_BASE_URL: http://petromac-backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - petromac-backend
    restart: unless-stopped

  petromac-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: petromac-backend:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.dev
    volumes:
      - ./data:/app/data
    restart: unless-stopped
